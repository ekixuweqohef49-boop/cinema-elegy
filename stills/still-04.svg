<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="深焦走廊透视的电影剧照（合成）">
  <defs>
    <linearGradient id="deep4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="end4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe6ef" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a3340" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="vig4" cx="50%" cy="50%" r="68%">
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft4"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#deep4)"/>

  <!-- 透视：嵌套矩形（一点透视） -->
  <g stroke="#ffffff" fill="none" opacity="0.10">
    <polygon points="0,0 1600,0 1120,180 480,180" stroke-width="2"/>
    <polygon points="0,900 1600,900 1120,720 480,720" stroke-width="2"/>
    <polygon points="0,0 480,180 480,720 0,900" stroke-width="2"/>
    <polygon points="1600,0 1120,180 1120,720 1600,900" stroke-width="2"/>
    <polygon points="480,180 1120,180 1120,720 480,720" stroke-width="1.5"/>
  </g>

  <!-- 尽头的光口 -->
  <polygon points="700,330 900,330 900,570 700,570" fill="url(#end4)" filter="url(#soft4)"/>
  <polygon points="700,330 900,330 900,570 700,570" fill="#e8edf5" opacity="0.22"/>

  <!-- 地面透视线（地板缝） -->
  <g stroke="#ffffff" opacity="0.07" stroke-width="1.5">
    <line x1="520" y1="720" x2="1080" y2="720"/>
    <line x1="420" y1="790" x2="1180" y2="790"/>
    <line x1="300" y1="860" x2="1300" y2="860"/>
  </g>

  <!-- 侧向壁灯：冷金点 -->
  <circle cx="470" cy="330" r="6" fill="#b9a06a"/>
  <circle cx="470" cy="330" r="40" fill="#b9a06a" opacity="0.13" filter="url(#soft4)"/>
  <circle cx="1132" cy="330" r="6" fill="#b9a06a"/>
  <circle cx="1132" cy="330" r="40" fill="#b9a06a" opacity="0.13" filter="url(#soft4)"/>

  <rect width="1600" height="900" fill="url(#vig4)"/>
  <rect width="1600" height="900" filter="url(#grain4)" opacity="0.17" style="mix-blend-mode:overlay"/>
</svg>
