<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="百叶窗光束进入暗室的电影剧照（合成）">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff6e2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="vig2" cx="46%" cy="46%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall2)"/>

  <!-- 斜向百叶光束 -->
  <g transform="rotate(-18 800 450)" opacity="0.9">
    <rect x="120" y="60" width="1400" height="420" fill="url(#beam)" filter="url(#soft2)"/>
    <g fill="#070708" opacity="0.72">
      <rect x="120" y="70" width="1400" height="14"/>
      <rect x="120" y="128" width="1400" height="16"/>
      <rect x="120" y="192" width="1400" height="18"/>
      <rect x="120" y="262" width="1400" height="20"/>
      <rect x="120" y="338" width="1400" height="24"/>
      <rect x="120" y="422" width="1400" height="28"/>
    </g>
  </g>

  <!-- 家具剪影：桌角与桌面反光 -->
  <g fill="#050506">
    <path d="M0 780 L620 700 L640 742 L0 900 Z"/>
    <rect x="120" y="640" width="180" height="12" rx="3" opacity="0.9"/>
  </g>
  <rect x="130" y="630" width="160" height="4" fill="#ffe9bf" opacity="0.28"/>

  <!-- 画面唯一的红：桌上一个远处的点 -->
  <circle cx="1290" cy="712" r="9" fill="#991b1b"/>
  <circle cx="1290" cy="712" r="34" fill="#991b1b" opacity="0.16" filter="url(#soft2)"/>

  <rect width="1600" height="900" fill="url(#vig2)"/>
  <rect width="1600" height="900" filter="url(#grain2)" opacity="0.17" style="mix-blend-mode:overlay"/>
</svg>
